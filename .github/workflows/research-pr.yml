name: Krypton Research PR Checks

on:
  pull_request:
    paths:
      - 'research_*.py'
      - 'regime_diagnostics.py'
      - 'forensic_diagnostics.py'
      - 'forensic_ci.py'
      - 'selection_pipeline.py'
      - 'execution_audit.py'
      - 'config_search.py'
      - 'tests/**'
      - '.github/workflows/research-pr.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile research modules
        run: >-
          python -m py_compile
          execution_audit.py research_metrics.py research_validation.py
          selection_pipeline.py regime_diagnostics.py forensic_diagnostics.py
          forensic_ci.py config_search.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bull capture and 2025 H1 forensic diagnostics
        run: python forensic_ci.py --start 2020-08-01 --end 2026-06-30
      - name: Upload forensic results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-forensic-results
          path: |
            forensic_period_summary.csv
            forensic_trades.csv
            forensic_daily.csv
            forensic_2025h1_trades.csv
            forensic_2025h1_daily.csv
            forensic_report.json
          if-no-files-found: error

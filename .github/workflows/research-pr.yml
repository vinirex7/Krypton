name: Krypton Research PR Checks

on:
  pull_request:
    paths:
      - 'research_*.py'
      - 'regime_diagnostics.py'
      - 'forensic_diagnostics.py'
      - 'forensic_ci.py'
      - 'cross_asset_diagnostics.py'
      - 'cross_asset_ci.py'
      - 'selection_pipeline.py'
      - 'execution_audit.py'
      - 'config_search.py'
      - 'tests/**'
      - '.github/workflows/research-pr.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile research modules
        run: >-
          python -m py_compile
          execution_audit.py research_metrics.py research_validation.py
          selection_pipeline.py regime_diagnostics.py forensic_diagnostics.py
          forensic_ci.py cross_asset_diagnostics.py cross_asset_ci.py config_search.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  cross_asset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run cross-asset opportunity diagnostics
        run: python cross_asset_ci.py --start 2020-08-01 --end 2026-06-30
      - name: Upload cross-asset results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-cross-asset-results
          path: |
            cross_asset_periods.csv
            cross_asset_comparison.json
          if-no-files-found: error

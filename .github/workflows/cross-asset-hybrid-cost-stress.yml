name: Krypton Cross-Asset Hybrid Cost Stress

on:
  pull_request:
    paths:
      - 'cross_asset_hybrid_cost_stress.py'
      - 'cross_asset_hybrid_v2.py'
      - 'cross_asset_allocation.py'
      - '.github/workflows/cross-asset-hybrid-cost-stress.yml'
  workflow_dispatch:

jobs:
  validate_cost_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile cost-stress modules
        run: >-
          python -m py_compile
          cross_asset_allocation.py
          cross_asset_hybrid_v2.py
          cross_asset_hybrid_cost_stress.py
      - name: Run adverse cost validation
        run: >-
          python cross_asset_hybrid_cost_stress.py
          --start 2020-08-01
          --end 2026-08-25
          --mc-runs 5000
      - name: Upload cost-stress results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-cross-asset-hybrid-cost-stress
          path: |
            cross_asset_hybrid_cost_stress_report.json
            cross_asset_hybrid_cost_stress_full.csv
            cross_asset_hybrid_cost_stress_periods.csv
            cross_asset_hybrid_cost_stress_curves.csv
            cross_asset_hybrid_cost_stress_rebalances.csv
          if-no-files-found: error

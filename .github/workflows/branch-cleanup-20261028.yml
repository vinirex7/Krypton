name: Authorized merged-branch cleanup 2026-10-28

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/live-backtest-parity-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  cleanup:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/live-backtest-parity-20261028'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact audited heads, then delete only merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('reports/2026-10-28/branch_audit.json', 'utf8'));
            const {owner, repo} = context.repo;
            const completed = [];
            for (const item of plan.filter(x => x.action === 'archive_then_delete')) {
              if (item.branch === 'main' || !['main', 'research/adaptive-portfolio-v1'].includes(item.base) || !item.merged_at) {
                throw new Error('Unsafe cleanup plan');
              }
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: item.pr});
              if (!pr.merged_at || pr.base.ref !== item.base || pr.head.sha !== item.sha || pr.head.ref !== item.branch) {
                throw new Error(`PR evidence changed: ${item.branch}`);
              }
              let branch;
              try {
                branch = (await github.rest.repos.getBranch({owner, repo, branch: item.branch})).data;
              } catch (e) {
                if (e.status !== 404) throw e;
                completed.push({branch: item.branch, status: 'already absent'});
                continue;
              }
              if (branch.commit.sha !== item.sha || branch.protected) {
                throw new Error(`Head changed/protected: ${item.branch}`);
              }
              const archive = `tags/archive/2026-10-28/${item.branch}`;
              try {
                await github.rest.git.createRef({owner, repo, ref: `refs/${archive}`, sha: item.sha});
              } catch (e) {
                if (e.status !== 422) throw e;
                const existing = (await github.rest.git.getRef({owner, repo, ref: archive})).data;
                if (existing.object.sha !== item.sha) throw new Error(`Archive conflict: ${item.branch}`);
              }
              await github.rest.git.deleteRef({owner, repo, ref: `heads/${item.branch}`});
              completed.push({branch: item.branch, sha: item.sha, archive, status: 'deleted'});
              core.info(`Archived and deleted ${item.branch}`);
            }
            fs.writeFileSync('branch-cleanup-result.json', JSON.stringify(completed, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-result-20261028
          path: branch-cleanup-result.json

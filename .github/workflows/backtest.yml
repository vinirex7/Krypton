name: Krypton Backtest and Walk-Forward

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run spot backtests
        run: |
          set -o pipefail
          mkdir -p results
          for s in SOLUSDT BTCUSDT BNBUSDT; do
            python backtest.py --symbol "$s" --start 2022-01-01 | tee "results/backtest_${s}.txt"
          done
      - name: Run walk-forward
        run: |
          set -o pipefail
          python walk_forward.py --start 2022-01-01 | tee results/walk_forward.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-backtest-results
          path: results/
          if-no-files-found: error

name: Krypton Backtest and Walk-Forward

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

  research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Replay current Aggressive C and fixed-policy walk-forward
        run: |
          set -o pipefail
          mkdir -p results
          python live_validation.py --periods 10m 2y 3y 4y --output results/live-parity \
            | tee results/live_validation.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-aggressive-c-live-parity-results
          path: results/
          if-no-files-found: error

name: Krypton Cross-Asset Slow-Cadence Robustness

on:
  pull_request:
    paths:
      - 'cross_asset_hybrid_slow_robustness.py'
      - 'cross_asset_hybrid_v2.py'
      - 'cross_asset_allocation.py'
      - '.github/workflows/cross-asset-hybrid-slow.yml'
  workflow_dispatch:

jobs:
  validate_slow_family:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile slow-family modules
        run: >-
          python -m py_compile
          cross_asset_allocation.py
          cross_asset_hybrid_v2.py
          cross_asset_hybrid_slow_robustness.py
      - name: Run slow-cadence robustness validation
        run: >-
          python cross_asset_hybrid_slow_robustness.py
          --start 2020-08-01
          --end 2026-08-25
          --mc-runs 5000
      - name: Upload slow-family results
        uses: actions/upload-artifact@v4
        with:
          name: krypton-cross-asset-hybrid-slow
          path: |
            cross_asset_hybrid_slow_report.json
            cross_asset_hybrid_slow_full.csv
            cross_asset_hybrid_slow_periods.csv
            cross_asset_hybrid_slow_curves.csv
            cross_asset_hybrid_slow_rebalances.csv
          if-no-files-found: error
